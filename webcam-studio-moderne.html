<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Studio — Photo avec effets</title>
  <style>
    :root{
      --bg:#0b0d10; --panel:#12161b; --muted:#8e98a6; --text:#eef2f6;
      --accent:#6ee7ff; --accent2:#9b8cff; --danger:#ff6b7a; --border:#202731;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 20% 0%,#18202b 0,#0b0d10 45%);
      color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1100px;margin:auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    h1{font-size:20px;margin:0;font-weight:700}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    button,select{font:inherit}
    button{border:1px solid var(--border);background:#171c23;color:var(--text);padding:10px 14px;
      border-radius:10px;cursor:pointer;transition:.2s}
    button:hover{border-color:#34404f;transform:translateY(-1px)}
    button.primary{background:linear-gradient(135deg,#67e8f9,#8b7cf6);color:#071018;border:0;font-weight:700}
    button:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}
    .card{background:rgba(18,22,27,.86);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
    .camera{position:relative;aspect-ratio:16/10;background:#050607;display:grid;place-items:center}
    video{width:100%;height:100%;object-fit:cover;display:block}
    .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}
    .placeholder strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px}
    .camera-controls{display:flex;justify-content:center;gap:10px;padding:14px;border-top:1px solid var(--border);flex-wrap:wrap}
    .shutter{width:64px;height:64px;border-radius:50%;padding:0;border:6px solid #2a313b;background:#f7fafc;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
    .shutter:hover{transform:scale(1.04)}
    .camera-status{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;pointer-events:none}
    .status{background:rgba(5,7,9,.82);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 12px;font-size:12px;color:#d9e0e8;backdrop-filter:blur(8px)}
    .countdown-overlay{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(72px,15vw,150px);font-weight:800;text-shadow:0 8px 35px rgba(0,0,0,.55);opacity:0;pointer-events:none}
    .countdown-overlay.show{opacity:1;animation:countdownPop .9s ease-out}
    @keyframes countdownPop{0%{transform:scale(.55);opacity:0}20%{opacity:1}100%{transform:scale(1.05);opacity:0}}
    .side{padding:16px}
    .gallery{margin-top:18px;padding:16px}
    .gallery-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .gallery-count{color:var(--muted);font-size:12px}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .gallery-empty{color:var(--muted);font-size:13px;text-align:center;padding:22px;border:1px dashed var(--border);border-radius:12px}
    .gallery-actions{display:flex;gap:8px;flex-wrap:wrap}
    .photo-card{position:relative;background:#0a0d11;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .photo-card img{width:100%;aspect-ratio:1;display:block;object-fit:cover}
    .photo-actions{display:flex;gap:6px;padding:8px}
    .photo-actions button{flex:1;padding:7px 8px;font-size:12px}
    .photo-number{position:absolute;top:8px;left:8px;background:rgba(5,7,9,.82);border-radius:999px;padding:4px 7px;font-size:11px}
    .danger{color:#ffd6db}
    .section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
    .effects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:420px;overflow:auto;padding-right:4px}
    .effect{padding:10px;border-radius:10px;background:#0f1318;border:1px solid var(--border);text-align:left}
    .effect.active{border-color:#6ee7ff;box-shadow:0 0 0 1px rgba(110,231,255,.18) inset}
    .options{display:grid;gap:8px;margin-top:16px}
    label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#0f1318;color:#cfd6de}
    input[type="checkbox"]{accent-color:#6ee7ff}
    footer{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
    .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
    .flash.fire{animation:flash .35s ease-out}
    @keyframes flash{0%{opacity:.95}100%{opacity:0}}
    @media (max-width:850px){.grid{grid-template-columns:1fr}.effects{max-height:260px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Webcam Studio</h1>
      <div class="toolbar">
        <button id="mirrorBtn" type="button">↔ Miroir</button>
        <button id="downloadBtn" type="button" disabled>↓ Enregistrer</button>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <div class="camera">
          <video id="video" autoplay playsinline muted></video>
          <div id="placeholder" class="placeholder">
            <div>
              <strong>Caméra inactive</strong>
              <span>Autorisez l’accès à votre webcam pour commencer.</span>
            </div>
          </div>
          <div id="countdownOverlay" class="countdown-overlay" aria-live="assertive"></div>
          <div class="camera-status"><span id="status" class="status">Caméra inactive</span></div>
          <div id="flash" class="flash"></div>
        </div>
        <div class="camera-controls">
          <button id="startBtn" class="primary" type="button">Activer la caméra</button>
          <button id="shotBtn" class="shutter" type="button" aria-label="Prendre une photo" disabled></button>
          <button id="stopBtn" type="button" disabled>Arrêter</button>
        </div>
      </section>

      <aside class="card side">
        <p class="section-title">Effets</p>
        <div id="effects" class="effects"></div>

        <div class="options">
          <label><span>Photo carrée</span><input id="square" type="checkbox"></label>
          <label><span>Compte à rebours 3 s</span><input id="countdown" type="checkbox"></label>
          <label><span>Flash</span><input id="flashToggle" type="checkbox" checked></label>
        </div>
      </aside>
    </main>

    <section class="card gallery" aria-labelledby="galleryTitle">
      <div class="gallery-head">
        <div>
          <p id="galleryTitle" class="section-title">Galerie</p>
          <span id="galleryCount" class="gallery-count">0 photo</span>
        </div>
        <div class="gallery-actions">
          <button id="exportGalleryBtn" type="button" disabled>⇩ Exporter la galerie (.ZIP)</button>
          <button id="clearGalleryBtn" type="button" disabled>Vider la galerie</button>
        </div>
      </div>
      <div id="galleryGrid" class="gallery-grid">
        <div id="galleryEmpty" class="gallery-empty">Vos photos apparaîtront ici.</div>
      </div>
    </section>

    <footer>Traitement local : les photos restent dans cette page et ne sont envoyées à aucun serveur.</footer>
  </div>

  <script>
    const effects = [
      ['Normal',''],
      ['Noir & Blanc','grayscale(1)'],
      ['Sépia','sepia(1)'],
      ['Vintage','sepia(.35) contrast(1.08) saturate(.85)'],
      ['Néon','saturate(2) contrast(1.2) hue-rotate(25deg)'],
      ['Menthe','hue-rotate(75deg) saturate(1.2)'],
      ['Rose','hue-rotate(315deg) saturate(1.4)'],
      ['Bleu Vrai','hue-rotate(180deg) saturate(1.25)'],
      ['Agrume','hue-rotate(25deg) saturate(1.5)'],
      ['Chaud','sepia(.3) saturate(1.45)'],
      ['Froid','saturate(.85) hue-rotate(175deg)'],
      ['Rouge','sepia(.15) saturate(2) hue-rotate(320deg)'],
      ['Vert','saturate(1.35) hue-rotate(70deg)'],
      ['Violet','saturate(1.5) hue-rotate(285deg)'],
      ['Jaune','saturate(1.5) hue-rotate(15deg)'],
      ['Contraste','contrast(1.45)'],
      ['Fade','contrast(.88) saturate(.75) brightness(1.08)'],
      ['Lumineux','brightness(1.25)'],
      ['Sombre','brightness(.72)'],
      ['Brume','contrast(.85) brightness(1.08) saturate(.75) blur(.35px)'],
      ['Flou Artistique','blur(2px) saturate(1.15)'],
      ['Rayon X','invert(1) grayscale(.7)'],
      ['Thermique','invert(1) sepia(1) hue-rotate(180deg) saturate(2)'],
      ['LSD','hue-rotate(140deg) saturate(2) contrast(1.35)'],
      ['Cyber','contrast(1.25) saturate(1.8) hue-rotate(190deg)'],
      ['Cartoon','contrast(1.5) saturate(1.45)'],
      ['Noir','brightness(.55) contrast(1.3) grayscale(.35)'],
      ['Blanc','brightness(1.5) contrast(.8) saturate(.5)'],
      ['Or','sepia(.65) saturate(1.6) hue-rotate(355deg)'],
      ['Cuivre','sepia(.5) saturate(1.45) hue-rotate(345deg)'],
      ['Argent','grayscale(.65) contrast(1.1) brightness(1.08)'],
      ['Zinc','grayscale(.4) contrast(1.25) saturate(.65)']
    ];

    const video = document.getElementById('video');
    const placeholder = document.getElementById('placeholder');
    const startBtn = document.getElementById('startBtn');
    const shotBtn = document.getElementById('shotBtn');
    const stopBtn = document.getElementById('stopBtn');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const effectsEl = document.getElementById('effects');
    const square = document.getElementById('square');
    const countdown = document.getElementById('countdown');
    const flashToggle = document.getElementById('flashToggle');
    const flash = document.getElementById('flash');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const status = document.getElementById('status');
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryEmpty = document.getElementById('galleryEmpty');
    const galleryCount = document.getElementById('galleryCount');
    const clearGalleryBtn = document.getElementById('clearGalleryBtn');
    const exportGalleryBtn = document.getElementById('exportGalleryBtn');

    let stream = null;
    let mirrored = false;
    let currentFilter = '';
    let lastPhoto = null;
    let capturing = false;
    const GALLERY_STORAGE_KEY = 'webcam-studio-gallery-v1';
    let gallery = [];

    function saveGallery() {
      try {
        localStorage.setItem(GALLERY_STORAGE_KEY, JSON.stringify(gallery));
      } catch (error) {
        setStatus('Galerie trop volumineuse pour le stockage local.');
      }
    }

    function loadGallery() {
      try {
        const saved = localStorage.getItem(GALLERY_STORAGE_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          gallery = parsed.filter(photo =>
            photo &&
            typeof photo.data === 'string' &&
            photo.data.startsWith('data:image/') &&
            typeof photo.name === 'string'
          );
        }
      } catch (error) {
        gallery = [];
      }
    }

    function setStatus(message) {
      status.textContent = message;
    }
    function updateGallery() {
      galleryGrid.querySelectorAll('.photo-card').forEach(card => card.remove());
      galleryEmpty.style.display = gallery.length ? 'none' : 'block';
      galleryCount.textContent = gallery.length + (gallery.length > 1 ? ' photos' : ' photo');
      clearGalleryBtn.disabled = gallery.length === 0;
      exportGalleryBtn.disabled = gallery.length === 0;

      gallery.forEach((photo, index) => {
        const card = document.createElement('article');
        card.className = 'photo-card';
        card.innerHTML = `
          <span class="photo-number">#${gallery.length - index}</span>
          <img src="${photo.data}" alt="Photo ${gallery.length - index}" loading="lazy">
          <div class="photo-actions">
            <button type="button" data-action="download">Enregistrer</button>
            <button type="button" class="danger" data-action="delete" aria-label="Supprimer la photo ${gallery.length - index}">Supprimer</button>
          </div>
        `;

        card.querySelector('[data-action="download"]').addEventListener('click', () => {
          downloadPhoto(photo.data, photo.name);
        });
        card.querySelector('[data-action="delete"]').addEventListener('click', () => {
          gallery.splice(index, 1);
          saveGallery();
          updateGallery();
        });
        galleryGrid.appendChild(card);
      });
    }

    function downloadPhoto(data, filename) {
      const a = document.createElement('a');
      a.href = data;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function dataUrlToBytes(dataUrl) {
      const base64 = dataUrl.split(',')[1] || '';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (const byte of bytes) {
        crc ^= byte;
        for (let i = 0; i < 8; i++) {
          crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
        }
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function createZip(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = encoder.encode(file.name);
        const data = file.data;
        const crc = crc32(data);
        const local = new Uint8Array(30 + nameBytes.length + data.length);
        const view = new DataView(local.buffer);

        view.setUint32(0, 0x04034b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 0, true);
        view.setUint16(8, 0, true);
        view.setUint16(10, 0, true);
        view.setUint16(12, 0, true);
        view.setUint32(14, crc, true);
        view.setUint32(18, data.length, true);
        view.setUint32(22, data.length, true);
        view.setUint16(26, nameBytes.length, true);
        view.setUint16(28, 0, true);
        local.set(nameBytes, 30);
        local.set(data, 30 + nameBytes.length);
        localParts.push(local);

        const central = new Uint8Array(46 + nameBytes.length);
        const centralView = new DataView(central.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, 0, true);
        centralView.setUint16(14, 0, true);
        centralView.setUint32(16, crc, true);
        centralView.setUint32(20, data.length, true);
        centralView.setUint32(24, data.length, true);
        centralView.setUint16(28, nameBytes.length, true);
        centralView.setUint16(30, 0, true);
        centralView.setUint16(32, 0, true);
        centralView.setUint16(34, 0, true);
        centralView.setUint16(36, 0, true);
        centralView.setUint32(38, 0, true);
        centralView.setUint32(42, offset, true);
        central.set(nameBytes, 46);
        centralParts.push(central);

        offset += local.length;
      }

      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, offset, true);
      endView.setUint16(20, 0, true);

      return new Blob([...localParts, ...centralParts, end], { type: 'application/zip' });
    }

    async function exportGallery() {
      if (!gallery.length) return;

      try {
        setStatus('Création du ZIP…');
        exportGalleryBtn.disabled = true;

        const files = gallery.map((photo, index) => ({
          name: photo.name || 'webcam-photo-' + String(index + 1).padStart(3, '0') + '.jpg',
          data: dataUrlToBytes(photo.data)
        }));

        const blob = createZip(files);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'webcam-galerie-' + new Date().toISOString().slice(0, 10) + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setStatus(gallery.length + ' photo' + (gallery.length > 1 ? 's' : '') + ' exportée' + (gallery.length > 1 ? 's' : '') + '.');
      } catch (error) {
        setStatus('Impossible de créer le ZIP.');
      } finally {
        exportGalleryBtn.disabled = gallery.length === 0;
      }
    }

    exportGalleryBtn.addEventListener('click', exportGallery);

    clearGalleryBtn.addEventListener('click', () => {
      gallery = [];
      saveGallery();
      updateGallery();
      setStatus('Galerie vidée.');
    });


    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      placeholder.style.display = 'grid';
      shotBtn.disabled = true;
      stopBtn.disabled = true;
      startBtn.disabled = false;
      startBtn.textContent = 'Activer la caméra';
      setStatus('Caméra inactive');
    }

    effects.forEach(([name, filter], index) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'effect' + (index === 0 ? ' active' : '');
      btn.textContent = name;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.effect').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = filter;
        video.style.filter = currentFilter;
      });
      effectsEl.appendChild(btn);
    });

    mirrorBtn.addEventListener('click', () => {
      mirrored = !mirrored;
      video.style.transform = mirrored ? 'scaleX(-1)' : '';
    });

    startBtn.addEventListener('click', async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('Webcam non prise en charge par ce navigateur.');
        return;
      }
      try {
        startBtn.disabled = true;
        setStatus('Demande d’accès à la caméra…');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        placeholder.style.display = 'none';
        shotBtn.disabled = false;
        stopBtn.disabled = false;
        downloadBtn.disabled = !lastPhoto;
        startBtn.textContent = 'Caméra active';
        setStatus('Caméra active');
      } catch (error) {
        startBtn.disabled = false;
        const message = error?.name === 'NotAllowedError'
          ? 'Accès à la caméra refusé.'
          : error?.name === 'NotFoundError'
            ? 'Aucune webcam détectée.'
            : 'Impossible d’accéder à la caméra.';
        setStatus(message);
      }
    });

    stopBtn.addEventListener('click', stopCamera);

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function takePhoto() {
      if (!stream || capturing) return;
      capturing = true;
      shotBtn.disabled = true;
      setStatus('Préparation de la photo…');

      try {
        if (countdown.checked) {
          for (let i = 3; i > 0; i--) {
            countdownOverlay.textContent = String(i);
            countdownOverlay.classList.remove('show');
            void countdownOverlay.offsetWidth;
            countdownOverlay.classList.add('show');
            setStatus('Photo dans ' + i + '…');
            await wait(1000);
          }
        }

        const sourceWidth = video.videoWidth;
        const sourceHeight = video.videoHeight;
        if (!sourceWidth || !sourceHeight) return;

        let width = sourceWidth;
        let height = sourceHeight;
        let sx = 0;
        let sy = 0;

        if (square.checked) {
          const size = Math.min(sourceWidth, sourceHeight);
          sx = (sourceWidth - size) / 2;
          sy = (sourceHeight - size) / 2;
          width = size;
          height = size;
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('Canvas indisponible');

        ctx.save();
        if (mirrored) {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }
        ctx.filter = currentFilter || 'none';
        ctx.drawImage(video, sx, sy, width, height, 0, 0, width, height);
        ctx.restore();

        lastPhoto = canvas.toDataURL('image/jpeg', .92);
        const filename = 'webcam-photo-' + new Date().toISOString().replace(/[:.]/g, '-') + '.jpg';
        gallery.unshift({ data: lastPhoto, name: filename });
        saveGallery();
        updateGallery();
        downloadBtn.disabled = false;
        setStatus('Photo prête à enregistrer.');

        if (flashToggle.checked) {
          flash.classList.remove('fire');
          void flash.offsetWidth;
          flash.classList.add('fire');
        }
      } catch (error) {
        setStatus('Impossible de prendre la photo.');
      } finally {
        capturing = false;
        shotBtn.disabled = !stream;
        countdownOverlay.classList.remove('show');
      }
    }

    shotBtn.addEventListener('click', takePhoto);

    downloadBtn.addEventListener('click', () => {
      if (!lastPhoto) return;
      const photo = gallery[0];
      downloadPhoto(lastPhoto, photo?.name || 'webcam-photo.jpg');
    });

    loadGallery();
    updateGallery();

    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
